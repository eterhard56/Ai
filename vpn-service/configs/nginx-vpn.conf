# Separate VirtualHost for VPN Web UI — does NOT touch 80/443
# Installed as: /etc/nginx/sites-available/vpn-service

server {
    listen 9443;
    listen [::]:9443;
    server_name _;

    access_log /opt/vpn-service/logs/nginx-vpn-access.log;
    error_log  /opt/vpn-service/logs/nginx-vpn-error.log;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:51821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
