server {
    listen 8088;
    listen [::]:8088;
    server_name _;
    client_max_body_size 50m;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /agents/direct/ {
        proxy_pass http://127.0.0.1:8101/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    location /agents/seo/ {
        proxy_pass http://127.0.0.1:8102/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    location /agents/analytics/ {
        proxy_pass http://127.0.0.1:8103/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    location /agents/crm/ {
        proxy_pass http://127.0.0.1:8104/;
        proxy_set_header Host $host;
    }
    location /agents/parser/ {
        proxy_pass http://127.0.0.1:8105/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    location /agents/telegram/ {
        proxy_pass http://127.0.0.1:8106/;
        proxy_set_header Host $host;
    }

    location /docs { proxy_pass http://127.0.0.1:8010/docs; }
    location /health { proxy_pass http://127.0.0.1:8010/health; }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
