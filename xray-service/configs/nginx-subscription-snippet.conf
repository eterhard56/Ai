# Happ / 3X-UI subscription proxy — include inside skolesnikov.site :443 server block.
# Isolated snippet: only /sub/ path, does not affect client-finder routes.
# Uses local wrapper (2097) to inject Happ DNS + global routing into subscription body.
location /sub/ {
    proxy_pass http://127.0.0.1:2097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    add_header dns-from-json-enable "true" always;
    add_header routing-enable "true" always;
    add_header profile-update-interval "12" always;
}

# Optional JSON/Clash subscription paths served by 3X-UI
location /json/ {
    proxy_pass http://127.0.0.1:2096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /clash/ {
    proxy_pass http://127.0.0.1:2096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
