# Happ / 3X-UI subscription proxy — include inside skolesnikov.site :443 server block.
# Isolated snippet: only /sub/ path, does not affect client-finder routes.
location /sub/ {
    proxy_pass http://127.0.0.1:2096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}

# Optional JSON/Clash subscription paths served by 3X-UI
location /json/ {
    proxy_pass http://127.0.0.1:2096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /clash/ {
    proxy_pass http://127.0.0.1:2096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
