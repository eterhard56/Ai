# SNI-based TLS passthrough on 443: Reality (cloudflare SNI) -> Xray, else -> nginx HTTPS
map $ssl_preread_server_name $xray_stream_backend {
    www.cloudflare.com  127.0.0.1:8444;
    default             127.0.0.1:8443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $xray_stream_backend;
    proxy_connect_timeout 15s;
    proxy_timeout 3600s;
}
