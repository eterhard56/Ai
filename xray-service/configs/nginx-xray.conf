# Separate VirtualHost for 3X-UI panel — does NOT touch 80/443
server {
    listen 2083;
    listen [::]:2083;
    server_name _;

    access_log /opt/xray-service/logs/nginx-panel-access.log;
    error_log  /opt/xray-service/logs/nginx-panel-error.log;

    location / {
        proxy_pass http://127.0.0.1:2053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# Subscription endpoint for Happ
server {
    listen 2087;
    listen [::]:2087;
    server_name _;

    access_log /opt/xray-service/logs/nginx-sub-access.log;
    error_log  /opt/xray-service/logs/nginx-sub-error.log;

    location / {
        proxy_pass http://127.0.0.1:2096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
