# Separate VirtualHost for 3X-UI panel — does NOT touch skolesnikov.site 80/443
server {
    listen 2083;
    listen [::]:2083;
    server_name _;

    access_log /opt/xray-service/logs/nginx-panel-access.log;
    error_log  /opt/xray-service/logs/nginx-panel-error.log;

    location / {
        proxy_pass http://127.0.0.1:2053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# HTTPS subscription (backup endpoint on dedicated port)
server {
    listen 2087 ssl http2;
    listen [::]:2087 ssl http2;
    server_name skolesnikov.site;

    ssl_certificate /etc/letsencrypt/live/skolesnikov.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skolesnikov.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /opt/xray-service/logs/nginx-sub-access.log;
    error_log  /opt/xray-service/logs/nginx-sub-error.log;

    location / {
        proxy_pass http://127.0.0.1:2096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# HTTPS subscription on 443 is proxied via /etc/nginx/snippets/xray-subscription.conf
# included in the skolesnikov.site vhost (standard port for Happ iOS / ATS).
