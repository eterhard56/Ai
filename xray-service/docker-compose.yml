services:
  xray-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: xray-3x-ui
    hostname: xray-3x-ui
    networks:
      - xray-network
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data/db:/etc/x-ui
      - ./data/cert:/root/cert
      - ./logs:/var/log/x-ui
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
    ports:
      - "127.0.0.1:2053:2053"
      - "127.0.0.1:2096:2096"
      - "8444:8444/tcp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2053/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  xray-network:
    name: xray-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
