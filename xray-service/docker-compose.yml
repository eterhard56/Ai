services:
  xray-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: xray-3x-ui
    hostname: xray-3x-ui
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data/db:/etc/x-ui
      - ./data/cert:/root/cert
      - ./logs:/var/log/x-ui
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2053/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
